# Amplify Hosting build specification.
#
# The backend phase is the important change from the previous, frontend-only
# spec: `ampx pipeline-deploy` deploys the Gen 2 backend and writes
# `amplify_outputs.json`, which the frontend build then compiles against.
#
# The Amplify service role needs permission to deploy the backend. See the
# "Deployment" section of the README.
version: 1
backend:
  phases:
    build:
      commands:
        - npm ci --cache .npm --prefer-offline
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        # Business rules are tested before anything ships. This application
        # handles money and eliminations; a red test should stop a deployment.
        - npm run test
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
